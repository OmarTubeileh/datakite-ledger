services:
  postgres:
    image: postgres:16-alpine
    container_name: datakite-postgres
    environment:
      POSTGRES_DB: datakite_ledger
      POSTGRES_USER: datakite
      POSTGRES_PASSWORD: datakite
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datakite -d datakite_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: datakite-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/datakite_ledger
      SPRING_DATASOURCE_USERNAME: datakite
      SPRING_DATASOURCE_PASSWORD: datakite
      GROQ_API_KEY: ${GROQ_API_KEY:-none}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: datakite-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  postgres-data:
