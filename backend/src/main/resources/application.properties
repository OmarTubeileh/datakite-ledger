spring.application.name=datakite-ledger

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/datakite_ledger}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:datakite}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:datakite}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true
spring.artemis.embedded.persistent=false
spring.artemis.embedded.queues=${datakite.ledger.jms.transactions-queue}

server.port=8080

datakite.ledger.fraud.review-threshold-usd=5000
datakite.ledger.jms.transactions-queue=transactions.ingest
datakite.ledger.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}

# Groq's OpenAI-compatible API. "none" is a deliberate non-blank placeholder so the app
# still starts cleanly with no key configured — CategorizationService catches the resulting
# 401 at call time and falls back to rule-based matching rather than failing to boot.
#
# base-url is deliberately "https://api.groq.com/openai" WITHOUT a trailing /v1: Spring AI's
# OpenAI client always appends "/v1/chat/completions" itself, unlike the raw OpenAI SDK
# convention Groq's own docs show (which does include /v1 in the base URL). Including /v1
# here produces a doubled "/v1/v1/chat/completions" path and a 404 from Groq.
spring.ai.openai.api-key=${GROQ_API_KEY:none}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.embedding.enabled=false
